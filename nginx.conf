server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Saubere URLs (Astro build format: "directory" → /pfad/index.html)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Gehashte Assets (Astro _astro/*) sehr lange cachen — Dateinamen ändern sich bei Änderungen.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Selbst gehostete Schriften ebenfalls lange cachen.
    location ~* \.(woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML nicht aggressiv cachen (damit Deploys sofort sichtbar sind).
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Kompression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Sinnvolle Sicherheits-Header für eine statische Seite
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;
}
